name: Straatfoto's zoeken
on:
  push:
    branches: [main]
    paths: [tools/fetch_photos.py, .github/workflows/fotos.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_photos.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huis12/fotos
          git diff --cached --quiet || (git commit -m "Open straatfoto's rond Oranjelaan 12" && git pull --rebase origin main && git push origin HEAD:main)
