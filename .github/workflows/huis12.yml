name: Huis 12 data ophalen
on:
  push:
    branches: [main]
    paths: [tools/fetch_house.py, .github/workflows/huis12.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p huis12/data && python3 tools/fetch_house.py
      - name: Committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huis12/data
          git diff --cached --quiet || (git commit -m "Huis 12: BAG, 3DBAG en luchtfoto" && git pull --rebase origin main && git push origin HEAD:main)
