<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const TARGET = '0383100000012506';
const NL = (n, d = 0) => Number(n).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });
const $ = (id) => document.getElementById(id);
const WIND = ['noord', 'noordoost', 'oost', 'zuidoost', 'zuid', 'zuidwest', 'west', 'noordwest'];
const windOf = (az) => WIND[Math.round((((az % 360) + 360) % 360) / 45) % 8];

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
$('app').appendChild(renderer.domElement);
const css = new CSS2DRenderer(); css.setSize(innerWidth, innerHeight); css.domElement.id = 'labels'; $('app').appendChild(css.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e6ef); scene.fog = new THREE.Fog(0xd9e6ef, 70, 160);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 3; controls.maxDistance = 70;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
scene.add(new THREE.HemisphereLight(0xeef5ff, 0x7d6f58, 1.0));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 120 });
scene.add(sun, sun.target);

// ---------- baksteen (waalformaat 210×50 mm, halfsteensverband) ----------
function brickTexture(base, mortar, seed) {
  const W = 1024, H = 1024, cols = 8, rows = 32;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = mortar; g.fillRect(0, 0, W, H);
  const bw = W / cols, bh = H / rows, j = 5; let s = seed;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const b = new THREE.Color(base);
  for (let r = 0; r < rows; r++) {
    const off = r % 2 ? bw / 2 : 0;
    for (let k = -1; k <= cols; k++) {
      const x = k * bw + off, col = b.clone();
      col.offsetHSL((rnd() - 0.5) * 0.02, (rnd() - 0.5) * 0.08, (rnd() - 0.5) * 0.16);
      g.fillStyle = '#' + col.getHexString(); g.fillRect(x + j / 2, r * bh + j / 2, bw - j, bh - j);
      for (let n = 0; n < 6; n++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.08})`; g.fillRect(x + j + rnd() * (bw - 3 * j), r * bh + j + rnd() * (bh - 3 * j), 3 + rnd() * 8, 2 + rnd() * 3); }
    }
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
const BRICK_U = 8 * 0.22, BRICK_V = 32 * 0.0625;

function newell(pts) {
  const n = new THREE.Vector3();
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; n.x += (a.y - b.y) * (a.z + b.z); n.y += (a.z - b.z) * (a.x + b.x); n.z += (a.x - b.x) * (a.y + b.y); }
  return n;
}
function triangulate(rings) {
  const nn = newell(rings[0]); const area = nn.length() / 2; const n = nn.clone().normalize();
  const u = new THREE.Vector3(); if (Math.abs(n.y) < 0.9) u.set(0, 1, 0).cross(n).normalize(); else u.set(1, 0, 0);
  const v = new THREE.Vector3().crossVectors(n, u);
  const to2 = (p) => new THREE.Vector2(p.dot(u), p.dot(v));
  const tris = THREE.ShapeUtils.triangulateShape(rings[0].map(to2), rings.slice(1).map((r) => r.map(to2)));
  return { tris, all: rings[0].concat(...rings.slice(1)), n, area };
}
function distSeg2(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(a[0] + t * dx - p[0], a[1] + t * dy - p[1]);
}

const pickables = []; let houseCenter, houseInfo = {}, dimsGroup, plotGroup;
const labels = [];
function label(text, pos, cls = 'dim', parent = scene) {
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  const o = new CSS2DObject(d); o.position.copy(pos); parent.add(o); labels.push(o); return o;
}

async function load() {
  const j = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
  const [bag3d, vbo, pand, meta, perceel, tex] = await Promise.all([
    j('./data/3dbag.json'), j('./data/bag_vbo.json'), j('./data/bag_pand.json'), j('./data/meta.json'), j('./data/perceel.json'),
    new THREE.TextureLoader().loadAsync('./data/luchtfoto_detail.jpg'),
  ]);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const O = meta.center_rd, bb = meta.bbox_detail_rd;
  const f = bag3d.features.find((x) => x.id.endsWith(TARGET));
  if (!f) throw new Error('Pand niet gevonden in 3DBAG');
  const T = f.transform || bag3d.metadata.transform;
  houseInfo = f.CityObjects['NL.IMBAG.Pand.' + TARGET].attributes;
  const g0 = houseInfo.b3_h_maaiveld || 0;
  const W = (x, y, z) => new THREE.Vector3(x - O[0], z - g0, -(y - O[1]));
  const toRD = (p) => [p.x + O[0], -p.z + O[1]];
  const uvOf = (p) => { const r = toRD(p); return [(r[0] - bb[0]) / (bb[2] - bb[0]), (r[1] - bb[1]) / (bb[3] - bb[1])]; };

  // grond: scherpe luchtfoto van de kavel, daarbuiten neutraal
  const gg = new THREE.PlaneGeometry(bb[2] - bb[0], bb[3] - bb[1]); gg.rotateX(-Math.PI / 2);
  gg.translate((bb[0] + bb[2]) / 2 - O[0], 0, -((bb[1] + bb[3]) / 2 - O[1]));
  const ground = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ map: tex, roughness: 1 })); ground.receiveShadow = true; scene.add(ground);
  scene.add(new THREE.Mesh(new THREE.CircleGeometry(400, 48).rotateX(-Math.PI / 2).translate(0, -0.03, 0), new THREE.MeshStandardMaterial({ color: 0xa3a596, roughness: 1 })));

  // buur-footprints om gedeelde muren te herkennen
  const neighbours = pand.features.filter((p) => p.properties.identificatie !== TARGET).map((p) => p.geometry.coordinates[0]);
  const isShared = (rdPts) => {
    const mid = [(rdPts[0][0] + rdPts[1][0]) / 2, (rdPts[0][1] + rdPts[1][1]) / 2];
    for (const ring of neighbours) for (let i = 1; i < ring.length; i++) if (distSeg2(mid, ring[i - 1], ring[i]) < 0.35) return true;
    return false;
  };

  const verts = f.vertices.map((v) => W(v[0] * T.scale[0] + T.translate[0], v[1] * T.scale[1] + T.translate[1], v[2] * T.scale[2] + T.translate[2]));
  const bp = Object.values(f.CityObjects).find((o) => o.type === 'BuildingPart');
  const geom = bp.geometry.find((g) => g.lod === '2.2');
  const surf = geom.semantics.surfaces, vals = geom.semantics.values[0];
  const buckets = { roof: [], wall: [], shared: [] }; const groundRings = [];
  geom.boundaries[0].forEach((poly, si) => {
    const s = surf[vals[si]] || { type: 'WallSurface' };
    const rings = poly.map((r) => r.map((i) => verts[i]));
    if (s.type === 'GroundSurface') { groundRings.push(rings[0]); return; }
    const { tris, all, n, area } = triangulate(rings);
    const roof = s.type === 'RoofSurface';
    let kind = roof ? 'roof' : 'wall';
    let rec;
    if (roof) {
      const ys = rings[0].map((p) => p.y);
      rec = { kind: 'Dakvlak', area, helling: s.b3_hellingshoek, az: s.b3_azimut, hmin: Math.min(...ys), hmax: Math.max(...ys) };
    } else {
      const lows = rings[0].slice().sort((a, b) => a.y - b.y).slice(0, 2).map(toRD);
      const shared = lows.length === 2 && Math.hypot(lows[0][0] - lows[1][0], lows[0][1] - lows[1][1]) > 0.3 && Math.min(...rings[0].map((p) => p.y)) < 0.5 && isShared(lows);
      if (shared) kind = 'shared';
      const az = (Math.atan2(n.x, -n.z) * 180 / Math.PI + 360) % 360;
      const ys = rings[0].map((p) => p.y);
      rec = { kind: shared ? 'Gedeelde muur' : 'Gevel', area, az, hmin: Math.min(...ys), hmax: Math.max(...ys), shared };
    }
    const h = new THREE.Vector3(-n.z, 0, n.x); if (h.lengthSq() < 1e-6) h.set(1, 0, 0); h.normalize();
    const pos = [], uv = [], nor = [];
    for (const t of tris) for (const k of t) {
      const p = all[k]; pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z);
      if (roof) uv.push(...uvOf(p)); else uv.push(p.dot(h) / BRICK_U, p.y / BRICK_V);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    buckets[kind].push({ g, rec });
  });
  const mats = {
    roof: new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, side: THREE.DoubleSide }),
    wall: new THREE.MeshStandardMaterial({ map: brickTexture(0x8c4632, '#b9b1a3', 7), roughness: 0.92, side: THREE.DoubleSide }),
    shared: new THREE.MeshStandardMaterial({ map: brickTexture(0x9b9690, '#8a857e', 3), roughness: 0.95, side: THREE.DoubleSide, transparent: true, opacity: 0.72 }),
  };
  const box = new THREE.Box3();
  for (const k of Object.keys(buckets)) {
    if (!buckets[k].length) continue;
    const ranges = []; let tri = 0;
    for (const { g, rec } of buckets[k]) { const n = g.attributes.position.count / 3; ranges.push({ s: tri, e: tri + n, rec }); tri += n; }
    const merged = BGU.mergeGeometries(buckets[k].map((b) => b.g)); merged.userData.ranges = ranges;
    const m = new THREE.Mesh(merged, mats[k]); m.castShadow = true; m.receiveShadow = true; scene.add(m); pickables.push(m);
    merged.computeBoundingBox(); box.union(merged.boundingBox);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(merged, 20), new THREE.LineBasicMaterial({ color: 0x2a1d17, transparent: true, opacity: 0.35 }));
    scene.add(e);
  }
  houseCenter = box.getCenter(new THREE.Vector3()); houseCenter.y = 3.5;
  sun.position.copy(houseCenter).add(new THREE.Vector3(-18, 30, -24)); sun.target.position.copy(houseCenter);

  // ---------- maatvoering ----------
  dimsGroup = new THREE.Group(); scene.add(dimsGroup);
  const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true });
  const addDim = (a, b, text, off) => {
    const pts = [a, b]; const g = new THREE.BufferGeometry().setFromPoints(pts);
    const l = new THREE.Line(g, lineMat); l.renderOrder = 10; dimsGroup.add(l);
    for (const p of pts) { const tick = new THREE.BufferGeometry().setFromPoints([p.clone().add(off.clone().multiplyScalar(-0.4)), p.clone().add(off.clone().multiplyScalar(0.4))]); const t = new THREE.Line(tick, lineMat); t.renderOrder = 10; dimsGroup.add(t); }
    label(text, a.clone().add(b).multiplyScalar(0.5), 'dim', dimsGroup);
  };
  // footprint uit grondvlakken -> georiënteerde rechthoek
  const fp = groundRings.flat();
  let best = null;
  for (const ring of groundRings) for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[(i + 1) % ring.length]; const d = new THREE.Vector2(b.x - a.x, b.z - a.z); if (d.length() < 0.5) continue; d.normalize();
    let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
    for (const p of fp) { const u = p.x * d.x + p.z * d.y, v = -p.x * d.y + p.z * d.x; u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v); }
    const ar = (u1 - u0) * (v1 - v0); if (!best || ar < best.ar) best = { ar, d, u0, u1, v0, v1 };
  }
  if (best) {
    const { d, u0, u1, v0, v1 } = best; const P = (u, v, y) => new THREE.Vector3(u * d.x - v * d.y, y, u * d.y + v * d.x);
    const nu = new THREE.Vector3(-d.y, 0, d.x), nv = new THREE.Vector3(d.x, 0, d.y);
    addDim(P(u0, v0 - 1.2, 0.05), P(u1, v0 - 1.2, 0.05), NL(u1 - u0, 2) + ' m', nv.clone().multiplyScalar(0.0).add(nu));
    addDim(P(u1 + 1.2, v0, 0.05), P(u1 + 1.2, v1, 0.05), NL(v1 - v0, 2) + ' m', nv);
    const nok = (houseInfo.b3_h_nok || box.max.y + g0) - g0, goot = (houseInfo.b3_h_dak_min || 2.9) - g0;
    const c = P(u1 + 1.2, v1 + 0.0, 0);
    addDim(c.clone(), c.clone().setY(nok), 'nok ' + NL(nok, 2) + ' m', nu);
    const c2 = P(u0 - 1.2, v1, 0);
    addDim(c2.clone(), c2.clone().setY(goot), 'goot ± ' + NL(goot, 1) + ' m', nu);
  }

  // ---------- kadastraal perceel ----------
  plotGroup = new THREE.Group(); scene.add(plotGroup);
  const [cx, cy] = meta.center_rd;
  const inside = (pt, ring) => { let c = false; for (let i = 0, k = ring.length - 1; i < ring.length; k = i++) { const [x1, y1] = ring[i], [x2, y2] = ring[k]; if ((y1 > pt[1]) !== (y2 > pt[1]) && pt[0] < (x2 - x1) * (pt[1] - y1) / (y2 - y1) + x1) c = !c; } return c; };
  const parcel = perceel.features.find((p) => inside([cx, cy], p.geometry.coordinates[0]));
  let parcelInfo = null;
  if (parcel) {
    const pr = parcel.properties; parcelInfo = pr;
    const pts = parcel.geometry.coordinates[0].map((c) => W(c[0], c[1], g0 + 0.08));
    const pl = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0xf07d00, dashSize: 0.6, gapSize: 0.3, depthTest: false, transparent: true }));
    pl.computeLineDistances(); pl.renderOrder = 11; plotGroup.add(pl);
    // label in de tuin: zwaartepunt van perceel
    const c = pts.slice(0, -1).reduce((s, p) => s.add(p), new THREE.Vector3()).multiplyScalar(1 / (pts.length - 1));
    label(`Perceel ${pr.sectie} ${pr.perceelnummer} · ${NL(pr.kadastraleGrootteWaarde)} m²`, c.setY(0.5), 'dim plot', plotGroup);
  }

  // ---------- gegevens ----------
  const v = (vbo.features || []).map((x) => x.properties).find((p) => String(p.huisnummer) === '12' && p.openbare_ruimte === 'Oranjelaan') || {};
  const a = houseInfo;
  const facts = [
    ['Bouwjaar', v.bouwjaar || a.oorspronkelijkbouwjaar], ['Woonopp.', v.oppervlakte ? v.oppervlakte + ' m²' : '–'],
    ['Nokhoogte', a.b3_h_nok ? NL(a.b3_h_nok - g0, 2) + ' m' : '–'], ['Perceel', parcelInfo ? NL(parcelInfo.kadastraleGrootteWaarde) + ' m²' : '–'],
    ['Grondvlak', a.b3_opp_grond ? NL(a.b3_opp_grond, 0) + ' m²' : '–'], ['Inhoud', a.b3_volume_lod22 ? NL(a.b3_volume_lod22, 0) + ' m³' : '–'],
  ];
  $('facts').innerHTML = facts.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('');
  $('more').innerHTML = [
    `Gebruik: ${v.gebruiksdoel || 'woonfunctie'} · ${v.pandstatus || a.status || ''}`,
    `Buitenmuur ${NL(a.b3_opp_buitenmuur || 0, 0)} m² · gedeeld met buren ${NL(a.b3_opp_scheidingsmuur || 0, 0)} m²`,
    `Dak: ${a.b3_n_vlakken || '–'} vlakken (${NL(a.b3_opp_dak_schuin || 0, 0)} m² hellend, ${NL(a.b3_opp_dak_plat || 0, 0)} m² plat), ${a.b3_n_nok || 0} nok`,
    parcelInfo ? `Kadastraal: ${parcelInfo.kadastraleGemeenteWaarde} ${parcelInfo.sectie} ${parcelInfo.perceelnummer}` : '',
    `BAG-pand ${TARGET} · hoogtemeting AHN ${a.b3_pw_datum || ''}`,
  ].filter(Boolean).join('<br>');
}

// ---------- tikken voor info ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 8 || dt > 600) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0]; if (!hit) return hideInfo();
  const r = hit.object.geometry.userData.ranges.find((x) => hit.faceIndex >= x.s && hit.faceIndex < x.e); if (r) showInfo(r.rec);
});
function showInfo(r) {
  const rows = [['Oppervlakte', NL(r.area, 1) + ' m²']];
  if (r.kind === 'Dakvlak') {
    rows.push(['Helling', r.helling < 5 ? 'plat (' + NL(r.helling, 0) + '°)' : NL(r.helling, 0) + '°']);
    if (r.helling >= 5) rows.push(['Ligt op het', windOf(r.az) + ' (' + NL(r.az, 0) + '°)']);
    rows.push(['Hoogte', NL(r.hmin, 1) + ' – ' + NL(r.hmax, 1) + ' m']);
  } else {
    rows.push(['Kijkt naar het', windOf(r.az) + ' (' + NL(r.az, 0) + '°)'], ['Hoogte', NL(r.hmin, 1) + ' – ' + NL(r.hmax, 1) + ' m']);
    if (r.shared) rows.push(['', 'Grenst aan de buren']);
  }
  $('infobody').innerHTML = `<h2>${r.kind}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  $('info').style.top = ($('card').getBoundingClientRect().bottom + 8) + 'px'; $('info').classList.add('show');
}
function hideInfo() { $('info').classList.remove('show'); }
$('infox').addEventListener('click', hideInfo);

// ---------- standpunten ----------
// staand scherm (iPhone) heeft een smaller beeld: verder weg zetten
const fit = () => (camera.aspect < 1 ? 1.8 : 1);
function dirFromAz(az, dist, dy) { const r = az * Math.PI / 180, k = fit(); return new THREE.Vector3(Math.sin(r) * dist * k, dy * (dy > 0 ? k : 1), -Math.cos(r) * dist * k); }
const views = {
  rond: () => ({ p: houseCenter.clone().add(dirFromAz(75, 22, 9)), t: houseCenter.clone() }),
  voor: () => ({ p: houseCenter.clone().add(dirFromAz(30, 18, -1)), t: houseCenter.clone().setY(3.8) }),
  achter: () => ({ p: houseCenter.clone().add(dirFromAz(210, 17, 1)), t: houseCenter.clone().setY(3.5) }),
  boven: () => ({ p: houseCenter.clone().add(new THREE.Vector3(0, 30 * fit(), 0.05)), t: houseCenter.clone().setY(0) }),
};
let tween = null;
function go(name, instant) {
  const v = views[name](); document.querySelectorAll('[data-v]').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.v === name)));
  if (instant) { camera.position.copy(v.p); controls.target.copy(v.t); controls.update(); return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: v.p, t1: v.t, s: performance.now() };
}
$('views').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { hideInfo(); go(b.dataset.v); } });
const toggle = (btn, grp) => $(btn).addEventListener('click', () => { const on = $(btn).getAttribute('aria-pressed') !== 'true'; $(btn).setAttribute('aria-pressed', String(on)); grp().visible = on; });
toggle('dims', () => dimsGroup); toggle('plot', () => plotGroup);
controls.addEventListener('start', () => { tween = null; });
$('toggle').addEventListener('click', () => { const c = $('card'); c.classList.toggle('open'); $('toggle').textContent = c.classList.contains('open') ? 'Minder' : 'Meer gegevens'; });

function frame(now) {
  if (tween) {
    const k = Math.min(1, (now - tween.s) / 1000), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (k >= 1) tween = null;
  }
  controls.update(); renderer.render(scene, camera);
  for (const o of labels) { let vis = true, p = o.parent; while (p) { if (!p.visible) { vis = false; break; } p = p.parent; } o.element.style.display = vis ? '' : 'none'; }
  css.render(scene, camera); requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); css.setSize(innerWidth, innerHeight); });

let started = false;
async function start() {
  $('spin').style.display = ''; $('retry').style.display = 'none'; $('msg').className = ''; $('msg').textContent = 'Oranjelaan 12 laden…';
  try {
    if (!started) { await load(); started = true; go('rond', true); requestAnimationFrame(frame); }
    $('overlay').classList.add('hide'); window.__ready = true;
  } catch (err) {
    console.warn(err); $('spin').style.display = 'none'; $('retry').style.display = 'inline-block';
    $('msg').className = 'err'; $('msg').textContent = 'Laden is mislukt: ' + err.message + '. Controleer je verbinding.';
  }
}
$('retry').addEventListener('click', start);
start();
</script>
</body>
